[project]
name = "velo"
version = "2.2.0"
description = "Mouse Input overlay for OBS. Made for aim trainers and FPS games."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }

[tool.setuptools.packages.find]
where = ["."]
include = ["velo*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.bumpversion]
current_version = "2.2.0"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "velo/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "velo/defaults.py"
search = "APP_VERSION = \"{current_version}\""
replace = "APP_VERSION = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "installer/Velo.iss"
search = "#define AppVersion   \"{current_version}\""
replace = "#define AppVersion   \"{new_version}\""
